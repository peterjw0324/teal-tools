<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>怎麼用玄空飛星排盤</title>
<style>
  /* 色票沿用 teal-pdp.css；iPhone Air 外框與 iOS 26 Safari 尺寸沿用 tools/device-frame.html（依 Peter 的截圖量測） */
  :root {
    --teal: #009193; --teal-deep: #00787a; --teal-link: #007879;
    --ink: #1d1d1f; --ink-3: #6e6e73; --ink-5: #a1a1a6;
    --canvas: #f5f5f7; --fill: rgba(118, 118, 128, .12);
    --sf: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Microsoft JhengHei', 'Helvetica Neue', Arial, sans-serif;
    --s: .58;                       /* 外框縮放 */
    --gutter: max(20px, calc((100vw - 980px) / 2));
  }
  @media (min-width: 734px) { :root { --s: .62; } }
  @media (min-width: 1069px) { :root { --s: .66; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; color: var(--ink); font-family: var(--sf); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
  button { font: inherit; color: inherit; }
  main { padding: 56px 0 72px; }
  .g-head { padding: 0 var(--gutter); max-width: calc(980px + 2 * var(--gutter)); }
  .eyebrow { margin: 0 0 8px; font-size: 17px; font-weight: 600; color: var(--teal-deep); }
  h1 { margin: 0; font-size: 32px; line-height: 1.16; font-weight: 700; text-wrap: pretty; }
  .lead { margin: 14px 0 0; max-width: 34em; font-size: 17px; line-height: 1.47; color: var(--ink-3); text-wrap: pretty; }
  @media (min-width: 734px) { h1 { font-size: 48px; line-height: 1.08; } .lead { font-size: 19px; } }

  /* 卡片廊 */
  .gallery { display: flex; gap: 24px; margin-top: 40px; padding: 0 var(--gutter) 8px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 var(--gutter); scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .gallery::-webkit-scrollbar { display: none; }
  .g-card { flex: none; width: calc(460.53px * var(--s)); scroll-snap-align: start; }
  .g-num { margin: 22px 0 6px; font-size: 14px; font-weight: 600; color: var(--teal-deep); }
  .g-card h2 { margin: 0; font-size: 21px; line-height: 1.24; font-weight: 700; }
  .g-card p.text { margin: 8px 0 0; font-size: 15px; line-height: 1.47; color: var(--ink-3); text-wrap: pretty; }
  .g-nav { display: flex; justify-content: flex-end; gap: 14px; padding: 20px var(--gutter) 0; max-width: calc(980px + 2 * var(--gutter)); }
  .g-nav button { width: 36px; height: 36px; border: 0; border-radius: 50%; background: var(--fill); display: grid; place-items: center; cursor: pointer; }
  .g-nav button:disabled { opacity: .35; cursor: default; }
  .g-nav svg { width: 18px; height: 18px; color: var(--ink); }
  .g-foot { padding: 28px var(--gutter) 0; max-width: calc(980px + 2 * var(--gutter)); font-size: 14px; line-height: 1.5; color: var(--ink-3); }

  /* iPhone Air：外框圖的螢幕 420 × 912 pt；狀態列 68 pt；網址列展開時 fixed 版面底部在 814 pt */
  .g-phone { position: relative; width: calc(460.53px * var(--s)); height: calc(945.89px * var(--s)); }
  .phone { position: absolute; left: 0; top: 0; width: 460.53px; height: 945.89px; transform: scale(var(--s)); transform-origin: 0 0; }
  .frame { position: absolute; left: 0; top: 0; width: 460.53px; height: 945.89px; z-index: 10; pointer-events: none; }
  .screen { position: absolute; left: 20.26px; top: 16.64px; width: 420px; height: 912px; overflow: hidden; background: var(--canvas); isolation: isolate; }
  .status { position: absolute; left: 0; top: 0; width: 420px; height: 68px; background: var(--canvas); color: #000; }
  .status svg { position: absolute; left: 0; top: 0; }
  .screen iframe { position: absolute; left: 0; top: 68px; width: 420px; height: 746px; border: 0; background: var(--canvas); pointer-events: none; opacity: 0; transition: opacity .5s ease; }
  .g-phone.ready iframe { opacity: 1; }
  .glass { position: absolute; z-index: 4; top: 830px; height: 48px; margin: 0; padding: 0; border: 0; color: #fff; border-radius: 999px;
    background: linear-gradient(rgb(255 255 255 / 8.5%), rgb(255 255 255 / 0%) 6px, rgb(255 255 255 / 0%) calc(100% - 7px), rgb(255 255 255 / 9%)), rgb(95 95 96 / 92%);
    box-shadow: inset 0 0 0 .34px rgb(255 255 255 / 10%), 0 4px 16px rgb(0 0 0 / 2.2%); }
  .glass svg { position: absolute; display: block; }
  .back { left: 33.33px; width: 49.33px; }
  .back svg { left: 18px; top: 15px; width: 11.06px; height: 18.66px; color: rgb(255 255 255 / 26.5%); }
  .tabs { left: 337.33px; width: 49.33px; }
  .tabs svg { left: 12.55px; top: 12.92px; width: 23.6px; height: 22.5px; }
  .url { left: 89.33px; width: 241.33px; overflow: hidden; }
  .url .pagemenu { left: 16.67px; top: 13px; width: 17px; height: 20px; }
  .url .reload { left: 211.01px; top: 14.66px; width: 15.17px; height: 18px; }
  .host { position: absolute; left: 0; right: 0; top: 14.66px; text-align: center; white-space: nowrap; font: 500 17px/20px -apple-system, system-ui, sans-serif; }
</style>
</head>
<body>
<main>
  <header class="g-head">
    <p class="eyebrow">怎麼用</p>
    <h1>一步一步，排出你家的盤。</h1>
    <p class="lead">用手機的 Safari 打開就能用，不用下載 App。晴天白天，用太陽量方位最準。</p>
  </header>
  <div class="gallery" id="gallery" role="list"></div>
  <div class="g-nav">
    <button id="prev" aria-label="上一步"><svg><use href="icons.svg#i-chevron-back"/></svg></button>
    <button id="next" aria-label="下一步"><svg><use href="icons.svg#i-chevron-forward"/></svg></button>
  </div>
  <p class="g-foot">晚上或陰天看不到太陽時，可以改成手動輸入羅盤量到的度數。畫面中的盤是範例：九運丑山未向下卦。</p>
</main>

      </div>

<script>
  const STEPS = [
    ['welcome', '打開，按「開始」', '用手機的 Safari 打開網址，按「開始」。'],
    ['year', '選落成年', '看建物謄本上的「建築完成日期」。1984、2004、2024 年會再問落成在立春前還是後。'],
    ['permissions', '允許三個權限', '相機、位置、動作與方向。資料只在你的手機上計算，不會上傳。'],
    ['calibrate8', '在空中畫幾次 8 字', '先校正手機羅盤，等一下才能帶你找到太陽。'],
    ['sun', '對準太陽', '讓太陽落進中間的圓圈，圓圈變綠就按「校正」。看螢幕就好，不要直視太陽。'],
    ['door', '手機底邊頂住大門', '手機平放、螢幕朝上，底邊貼住大門，按「記錄這一筆」。換兩、三個位置各記一筆。'],
    ['result', '看量測結果', '坐向和度數，還有你的手機羅盤在大門偏了多少。'],
    ['chart', '看你家的盤', '九宮飛星盤、每顆星的分類，以及初步結論。'],
    ['palace', '點一宮看建議', '每一宮的人丁、財運強弱，以及這一方適合高還是低、動還是靜。'],
  ];
  const gallery = document.getElementById('gallery');
  const tpl = document.getElementById('phoneTpl');
  STEPS.forEach(([step, title, text], i) => {
    const card = document.createElement('article');
    card.className = 'g-card';
    card.setAttribute('role', 'listitem');
    const phone = tpl.content.firstElementChild.cloneNode(true);
    const frame = phone.querySelector('iframe');
    frame.title = title;
    frame.src = `index.html?demo=${step}`;
    card.append(phone);
    card.insertAdjacentHTML('beforeend', `<p class="g-num">第 ${i + 1} 步</p><h2>${title}</h2><p class="text">${text}</p>`);
    gallery.append(card);
  });

  // 示範畫面走到該步驟後才淡入；收不到通知時自己檢查，最多等 8 秒
  const show = (f) => f.closest('.g-phone').classList.add('ready');
  window.addEventListener('message', (e) => {
    if (e.data?.type !== 'xk-demo-ready') return;
    const f = [...gallery.querySelectorAll('iframe')].find((x) => x.contentWindow === e.source);
    if (f) show(f);
  });
  gallery.querySelectorAll('iframe').forEach((f) => f.addEventListener('load', () => {
    const t0 = Date.now();
    const id = setInterval(() => {
      let done = false;
      try { done = !!f.contentWindow.__xkDemoReady; } catch { done = true; }
      if (done || Date.now() - t0 > 8000) { clearInterval(id); show(f); }
    }, 300);
  }));

  const prev = document.getElementById('prev'), next = document.getElementById('next');
  const step = () => gallery.querySelector('.g-card').offsetWidth + 24;
  prev.addEventListener('click', () => gallery.scrollBy({ left: -step(), behavior: 'smooth' }));
  next.addEventListener('click', () => gallery.scrollBy({ left: step(), behavior: 'smooth' }));
  const paint = () => {
    prev.disabled = gallery.scrollLeft <= 2;
    next.disabled = gallery.scrollLeft + gallery.clientWidth >= gallery.scrollWidth - 2;
  };
  gallery.addEventListener('scroll', paint, { passive: true });
  window.addEventListener('resize', paint);
  paint();
</script>
</body>
</html>
