<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>方位量測測試</title>
<style>
  :root {
    --bg: #fbfbfd;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --line: #d2d2d7;
    --accent: #0071e3;
    --warn: #b64400;
    --warn-bg: #fff4e5;
    --ok: #1d7a3a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000;
      --card: #1c1c1e;
      --text: #f5f5f7;
      --muted: #a1a1a6;
      --line: #3a3a3c;
      --accent: #2997ff;
      --warn: #ff9f0a;
      --warn-bg: #2c1f0a;
      --ok: #30d158;
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000; --card: #1c1c1e; --text: #f5f5f7; --muted: #a1a1a6;
    --line: #3a3a3c; --accent: #2997ff; --warn: #ff9f0a; --warn-bg: #2c1f0a; --ok: #30d158;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Helvetica Neue", sans-serif;
    line-height: 1.5;
  }
  main { max-width: 480px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 28px; line-height: 1.15; margin: 0 0 8px; font-weight: 700; letter-spacing: -0.01em; }
  .lead { color: var(--muted); margin: 0 0 24px; font-size: 17px; }
  ol.steps { margin: 0 0 24px; padding-left: 1.3em; font-size: 15px; }
  ol.steps li { margin-bottom: 6px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; margin-bottom: 16px; }
  button {
    font: inherit; font-size: 17px; border: 0; border-radius: 12px; padding: 14px 18px; width: 100%;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  button:disabled { opacity: .4; cursor: default; }
  .row { display: flex; gap: 12px; }
  .row > * { flex: 1; }
  .dial-wrap { width: 100%; max-width: 260px; margin: 4px auto 12px; aspect-ratio: 1 / 1; }
  .dial-wrap svg { width: 100%; height: 100%; display: block; }
  .big { font-size: 56px; font-weight: 700; line-height: 1; text-align: center; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .big small { font-size: 20px; font-weight: 600; color: var(--muted); }
  .sub { text-align: center; color: var(--muted); margin: 8px 0 0; font-size: 15px; }
  .pan { text-align: center; font-size: 22px; font-weight: 600; margin: 12px 0 0; }
  .note { font-size: 14px; color: var(--muted); margin: 8px 0 0; }
  .warn { background: var(--warn-bg); color: var(--warn); border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-top: 12px; }
  .warn:empty { display: none; }
  .ok { color: var(--ok); }
  table { width: 100%; border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums; }
  td, th { text-align: left; padding: 6px 0; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; }
  label { display: block; font-size: 15px; margin-bottom: 6px; }
  input[type="number"] {
    font: inherit; font-size: 17px; width: 100%; padding: 12px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
  }
  details summary { cursor: pointer; color: var(--accent); font-size: 15px; }
  pre { white-space: pre-wrap; word-break: break-all; font-size: 12px; color: var(--muted); margin: 8px 0 0; }
  h2 { font-size: 19px; margin: 0 0 12px; }
</style>
</head>
<body>
<main>
  <h1>方位量測測試</h1>
  <p class="lead">測手機量出來的度數穩不穩。這頁只在手機上讀指南針，不會上傳任何資料。</p>

  <ol class="steps">
    <li>拿掉有磁鐵的手機殼（例如 MagSafe）。</li>
    <li>站在大門或陽台落地窗內側，臉朝外。</li>
    <li>手機平放、螢幕朝上，手機頂端朝外，和門或窗垂直。</li>
    <li>按「開始量」，讀數穩定後按「記一筆」。換 3 個位置各記一筆。</li>
  </ol>

  <div class="card">
    <button id="start">開始量</button>
    <div class="warn" id="envWarn"></div>
  </div>

  <div class="card" id="live" hidden>
    <div class="dial-wrap"><svg id="dial" viewBox="-120 -120 240 240" aria-hidden="true"></svg></div>
    <div class="big"><span id="deg">—</span><small>°</small></div>
    <p class="sub">向（磁北，手機頂端指的方向）</p>
    <p class="pan" id="pan">—</p>
    <p class="note" id="meta"></p>
    <div class="warn" id="liveWarn"></div>
    <div class="row" style="margin-top:16px">
      <button id="mark">記一筆</button>
      <button class="secondary" id="reset">清除</button>
    </div>
  </div>

  <div class="card" id="logCard" hidden>
    <h2>已記錄</h2>
    <table>
      <thead><tr><th>#</th><th>向</th><th>坐山</th><th>穩定度</th></tr></thead>
      <tbody id="log"></tbody>
    </table>
    <p class="note" id="summary"></p>
    <div class="warn" id="logWarn"></div>
  </div>

  <div class="card">
    <label for="ref">對照讀數（選填）：羅盤，或 iPhone 指南針 App 關掉「使用真北」後的度數</label>
    <input id="ref" type="number" inputmode="decimal" min="0" max="360" step="0.5" placeholder="例如 210">
    <p class="note" id="refDiff"></p>
  </div>

  <div class="card">
    <button class="secondary" id="copy">複製測試結果</button>
    <p class="note" id="copyMsg">複製後貼回給 Claude。</p>
    <details style="margin-top:12px">
      <summary>診斷資料</summary>
      <pre id="diag"></pre>
    </details>
  </div>
</main>

<script>
(function () {
  'use strict';

  var MOUNTAINS = ['子','癸','丑','艮','寅','甲','卯','乙','辰','巽','巳','丙','午','丁','未','坤','申','庚','酉','辛','戌','乾','亥','壬'];
  var BOUNDARY_WARN = 3; // 兼向範圍
  var SPREAD_WARN = 5;   // 多筆之間的容許差距

  var $ = function (id) { return document.getElementById(id); };
  var samples = [];      // 最近 1 秒的讀數 {t, h}
  var records = [];
  var source = '';
  var lastEvent = null;
  var lastAccuracy = null;
  var eventCount = 0;
  var smooth = null;     // 平滑後的單位向量

  function norm(d) { d = d % 360; return d < 0 ? d + 360 : d; }
  function mountainOf(d) {
    d = norm(d);
    var idx = Math.floor(norm(d + 7.5) / 15) % 24;
    var pos = norm(d + 7.5) % 15;       // 在這一山裡的位置 0–15
    var edge = Math.min(pos, 15 - pos);
    var neighbor = pos < 7.5 ? MOUNTAINS[(idx + 23) % 24] : MOUNTAINS[(idx + 1) % 24];
    return { name: MOUNTAINS[idx], edge: edge, neighbor: neighbor };
  }
  function circMean(list) {
    var x = 0, y = 0;
    list.forEach(function (h) { x += Math.cos(h * Math.PI / 180); y += Math.sin(h * Math.PI / 180); });
    return norm(Math.atan2(y, x) * 180 / Math.PI);
  }
  function angDiff(a, b) { var d = Math.abs(norm(a) - norm(b)); return d > 180 ? 360 - d : d; }
  function maxSpread(list) {
    var m = 0;
    for (var i = 0; i < list.length; i++) for (var j = i + 1; j < list.length; j++) m = Math.max(m, angDiff(list[i], list[j]));
    return m;
  }
  function fmt(d) { return (Math.round(d * 10) / 10).toFixed(1); }

  // 環境檢查
  var ua = navigator.userAgent;
  var inApp = /Line\//i.test(ua) ? 'LINE' : /FBAN|FBAV/i.test(ua) ? 'Facebook' : /Instagram/i.test(ua) ? 'Instagram' : /MicroMessenger/i.test(ua) ? 'WeChat' : '';
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var envMsgs = [];
  if (!window.isSecureContext) envMsgs.push('這個網址不是 HTTPS，手機不會給指南針權限。');
  if (inApp) envMsgs.push('你正在用 ' + inApp + ' 內建瀏覽器開啟。如果讀不到度數，請改用 ' + (isIOS ? 'Safari' : 'Chrome') + ' 開這個網址。');
  if (!('DeviceOrientationEvent' in window)) envMsgs.push('這個瀏覽器不支援指南針。');
  $('envWarn').textContent = envMsgs.join(' ');

  // 羅盤盤面：24 山，向在上方
  (function buildDial() {
    var svg = $('dial');
    var ns = 'http://www.w3.org/2000/svg';
    var g = document.createElementNS(ns, 'g');
    g.setAttribute('id', 'ring');
    var ring = document.createElementNS(ns, 'circle');
    ring.setAttribute('r', '104'); ring.setAttribute('fill', 'none');
    ring.setAttribute('stroke', 'var(--line)'); ring.setAttribute('stroke-width', '1');
    g.appendChild(ring);
    for (var i = 0; i < 24; i++) {
      var a = i * 15;
      var b = (a - 7.5) * Math.PI / 180;
      var tick = document.createElementNS(ns, 'line');
      tick.setAttribute('x1', 98 * Math.sin(b)); tick.setAttribute('y1', -98 * Math.cos(b));
      tick.setAttribute('x2', 110 * Math.sin(b)); tick.setAttribute('y2', -110 * Math.cos(b));
      tick.setAttribute('stroke', 'var(--line)');
      g.appendChild(tick);
      var t = document.createElementNS(ns, 'text');
      var r = a * Math.PI / 180;
      t.setAttribute('x', 84 * Math.sin(r)); t.setAttribute('y', -84 * Math.cos(r));
      t.setAttribute('text-anchor', 'middle'); t.setAttribute('dominant-baseline', 'central');
      t.setAttribute('font-size', i % 2 ? '13' : '15');
      t.setAttribute('fill', i === 0 ? 'var(--accent)' : 'var(--text)');
      t.setAttribute('transform', 'rotate(' + a + ' ' + (84 * Math.sin(r)) + ' ' + (-84 * Math.cos(r)) + ')');
      t.textContent = MOUNTAINS[i];
      g.appendChild(t);
    }
    svg.appendChild(g);
    var pointer = document.createElementNS(ns, 'path');
    pointer.setAttribute('d', 'M0,-118 L-7,-104 L7,-104 Z');
    pointer.setAttribute('fill', 'var(--accent)');
    svg.appendChild(pointer);
    var label = document.createElementNS(ns, 'text');
    label.setAttribute('x', '0'); label.setAttribute('y', '0');
    label.setAttribute('text-anchor', 'middle'); label.setAttribute('dominant-baseline', 'central');
    label.setAttribute('font-size', '14'); label.setAttribute('fill', 'var(--muted)');
    label.textContent = '向';
    svg.appendChild(label);
  })();

  function onHeading(h, e) {
    var now = performance.now();
    eventCount++;
    lastEvent = e;
    samples.push({ t: now, h: h });
    while (samples.length && now - samples[0].t > 1000) samples.shift();

    var v = { x: Math.cos(h * Math.PI / 180), y: Math.sin(h * Math.PI / 180) };
    smooth = smooth ? { x: smooth.x * 0.8 + v.x * 0.2, y: smooth.y * 0.8 + v.y * 0.2 } : v;
    var shown = norm(Math.atan2(smooth.y, smooth.x) * 180 / Math.PI);
    render(shown, e);
  }

  function render(face, e) {
    var sit = norm(face + 180);
    var mf = mountainOf(face), ms = mountainOf(sit);
    $('deg').textContent = fmt(face);
    $('pan').textContent = ms.name + '山' + mf.name + '向';
    $('ring').setAttribute('transform', 'rotate(' + (-face) + ')');

    var beta = e.beta || 0, gamma = e.gamma || 0;
    var tilt = Math.max(Math.abs(beta), Math.abs(gamma));
    var jitter = samples.length > 3 ? maxSpread(samples.map(function (s) { return s.h; })) : 0;
    var meta = '坐山 ' + fmt(sit) + '°　傾斜 ' + Math.round(tilt) + '°　1 秒內晃動 ' + fmt(jitter) + '°';
    if (lastAccuracy != null) meta += '　iOS 精度 ±' + Math.round(lastAccuracy) + '°';
    $('meta').textContent = meta;

    var w = [];
    if (tilt > 20) w.push('手機請放平。');
    if (lastAccuracy != null && (lastAccuracy < 0 || lastAccuracy > 15)) w.push('指南針精度不足，請拿著手機在空中畫幾次 8 字再量。');
    if (mf.edge < BOUNDARY_WARN) w.push('向落在「' + mf.name + '」和「' + mf.neighbor + '」交界 ' + fmt(mf.edge) + '° 內，一點誤差就會換成另一個盤。');
    $('liveWarn').textContent = w.join(' ');
    updateRefDiff(face);
  }

  function updateRefDiff(face) {
    var ref = parseFloat($('ref').value);
    if (isNaN(ref)) { $('refDiff').textContent = ''; return; }
    var base = records.length ? circMean(records.map(function (r) { return r.face; })) : face;
    var label = records.length ? '已記錄的平均' : '目前讀數';
    var signed = norm(base - ref); if (signed > 180) signed -= 360;
    $('refDiff').textContent = label + '比對照讀數' + (signed >= 0 ? '多 ' : '少 ') + fmt(Math.abs(signed)) + '°。差 4–5° 左右通常是有一邊用了真北。';
  }

  function handleOrientation(e) {
    if (typeof e.webkitCompassHeading === 'number' && e.webkitCompassHeading >= 0) {
      source = 'iOS webkitCompassHeading';
      lastAccuracy = typeof e.webkitCompassAccuracy === 'number' ? e.webkitCompassAccuracy : null;
      onHeading(norm(e.webkitCompassHeading), e);
    } else if (e.absolute === true && typeof e.alpha === 'number') {
      // 手機頂端的水平方位 = 360 − alpha（beta 小於 90° 時成立，和 gamma 無關）
      source = e.type + ' alpha';
      onHeading(norm(360 - e.alpha), e);
    }
  }

  function startListening() {
    $('start').textContent = '量測中';
    $('live').hidden = false;
    if ('ondeviceorientationabsolute' in window) {
      window.addEventListener('deviceorientationabsolute', handleOrientation);
    } else {
      window.addEventListener('deviceorientation', handleOrientation);
    }
    setTimeout(function () {
      if (eventCount === 0) {
        $('liveWarn').textContent = '讀不到指南針。' + (inApp ? '請改用 ' + (isIOS ? 'Safari' : 'Chrome') + ' 開這個網址。' : '請確認手機的「動作與方向」權限沒有被關掉。');
      }
    }, 3000);
  }

  $('start').addEventListener('click', function () {
    $('start').disabled = true;
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().then(function (state) {
        if (state === 'granted') { startListening(); }
        else { $('start').disabled = false; $('envWarn').textContent = '沒有拿到權限。請再按一次並選「允許」。'; }
      }).catch(function (err) {
        $('start').disabled = false;
        $('envWarn').textContent = '要求權限失敗：' + err;
      });
    } else {
      startListening();
    }
  });

  $('mark').addEventListener('click', function () {
    if (samples.length < 3) return;
    var list = samples.map(function (s) { return s.h; });
    var face = circMean(list);
    records.push({ face: face, sit: norm(face + 180), jitter: maxSpread(list), n: list.length, accuracy: lastAccuracy });
    drawLog();
  });

  $('reset').addEventListener('click', function () { records = []; drawLog(); });
  $('ref').addEventListener('input', function () { if (smooth) updateRefDiff(norm(Math.atan2(smooth.y, smooth.x) * 180 / Math.PI)); });

  function drawLog() {
    $('logCard').hidden = records.length === 0;
    var tb = $('log'); tb.innerHTML = '';
    records.forEach(function (r, i) {
      var tr = document.createElement('tr');
      [String(i + 1), fmt(r.face) + '°', mountainOf(r.sit).name + ' ' + fmt(r.sit) + '°', '±' + fmt(r.jitter / 2) + '°'].forEach(function (c) {
        var td = document.createElement('td'); td.textContent = c; tr.appendChild(td);
      });
      tb.appendChild(tr);
    });
    if (records.length) {
      var faces = records.map(function (r) { return r.face; });
      var mean = circMean(faces), spread = maxSpread(faces);
      var mf = mountainOf(mean), ms = mountainOf(norm(mean + 180));
      $('summary').textContent = '平均向 ' + fmt(mean) + '°，' + ms.name + '山' + mf.name + '向。各筆最大差距 ' + fmt(spread) + '°。';
      $('logWarn').textContent = records.length > 1 && spread > SPREAD_WARN
        ? '各筆差超過 ' + SPREAD_WARN + '°，可能有金屬干擾。請離鐵門、冷氣、大型電器 1 公尺以上再量。' : '';
    }
    updateRefDiff(0);
  }

  function diagText() {
    var e = lastEvent;
    return JSON.stringify({
      ua: ua, inApp: inApp || null, secure: window.isSecureContext, source: source || null,
      events: eventCount,
      last: e ? { type: e.type, absolute: e.absolute, alpha: e.alpha, beta: e.beta, gamma: e.gamma,
        webkitCompassHeading: e.webkitCompassHeading, webkitCompassAccuracy: e.webkitCompassAccuracy } : null,
      screenAngle: screen.orientation ? screen.orientation.angle : window.orientation,
      reference: $('ref').value || null,
      records: records.map(function (r) { return { face: +fmt(r.face), sit: +fmt(r.sit), jitter: +fmt(r.jitter), n: r.n, accuracy: r.accuracy }; })
    }, null, 2);
  }
  setInterval(function () { $('diag').textContent = diagText(); }, 500);

  $('copy').addEventListener('click', function () {
    var text = diagText();
    var done = function () { $('copyMsg').textContent = '已複製，貼回給 Claude。'; };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { $('copyMsg').textContent = '無法自動複製，請打開「診斷資料」手動複製。'; });
    } else {
      $('copyMsg').textContent = '無法自動複製，請打開「診斷資料」手動複製。';
    }
  });
})();
</script>
</body>
</html>
